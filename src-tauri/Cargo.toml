[package]
name = "eclipse-client"
version = "1.1.1"
description = "Eclipse Client — a Rust and Tauri Minecraft launcher"
authors = ["Eclipse Client"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
minisign-verify = "0.2"
aes-gcm = "0.10"
rand = "0.8"
regex = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
