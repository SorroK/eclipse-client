name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Eclipse Client ${{ github.ref_name }}"
          releaseBody: |
            Windows installer for new installs and the signed auto-update build for Eclipse Client ${{ github.ref_name }}.
            Installed launchers update themselves from Settings → Launcher updates.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ""

      - name: Sign the launcher executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is not set; releases must be signed." }
          $exe = "src-tauri/target/release/eclipse-client.exe"
          npx tauri signer sign $exe
          $signature = (Get-Content "$exe.sig" -Raw).Trim()
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $version = "${{ github.ref_name }}".TrimStart('v')
          $manifest = [ordered]@{
            version   = $version
            url       = "https://github.com/SorroK/eclipse-client/releases/download/${{ github.ref_name }}/eclipse-client.exe"
            signature = $signature
            sha256    = $sha256
            notes     = "Eclipse Client ${{ github.ref_name }} updates in place: the launcher downloads this build, verifies its signature, swaps itself, and reopens."
          } | ConvertTo-Json
          Set-Content -Path "latest-exe.json" -Value $manifest -Encoding utf8
          gh release upload "${{ github.ref_name }}" $exe "$exe.sig" latest-exe.json --clobber
